<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: sans-serif; background: #f4f4f4; padding: 40px 0; margin: 0;">
  <div style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 40px;">
    <h2 style="margin: 0 0 8px; color: #1c351c; font-size: 22px;">Your login code</h2>
    <p style="margin: 0 0 28px; color: #555; font-size: 15px;">
      Enter this code on the noahweis.dev admin login page:
    </p>
    <div style="font-family: monospace; font-size: 42px; font-weight: bold; letter-spacing: 14px;
                color: #1c351c; background: #f0f7f0; border-radius: 6px;
                padding: 20px; text-align: center; margin-bottom: 28px;">
      {{ .Token }}
    </div>
    <p style="color: #888; font-size: 13px; margin: 0;">
      This code expires in 1 hour. If you didn't request this, ignore this email.
    </p>
  </div>
</body>
</html>
